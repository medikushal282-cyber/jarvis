<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple E‑Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Mini Shop</h1>
        <div id="cart-icon">🛒 Cart (<span id="cart-count">0</span>)</div>
    </header>
    <section class="products">
        <article class="product" data-name="Red T‑Shirt" data-price="19.99">
            <h2>Red T‑Shirt</h2>
            <p>Price: $19.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>
        <article class="product" data-name="Blue Mug" data-price="9.99">
            <h2>Blue Mug</h2>
            <p>Price: $9.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>
        <article class="product" data-name="Green Hat" data-price="14.50">
            <h2>Green Hat</h2>
            <p>Price: $14.50</p>
            <button class="add-to-cart">Add to Cart</button>
        </article>
    </section>

    <aside id="cart-panel" class="hidden">
        <h2>Cart Summary</h2>
        <ul id="cart-items"></ul>
        <p>Subtotal: $<span id="cart-subtotal">0.00</span></p>
        <button id="checkout-btn">Checkout</button>
    </aside>

    <footer>
        <p>&copy; 2026 Mini Shop</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
