# Profile: support — customer support.
#
# The third profile, included for the same reason as sales: to prove the brain is a brain
# and not an incident-response script. Note how the safety posture differs from devops —
# here the highest-risk action is not a restart but an irreversible refund, and the memory
# that matters most is a stated entitlement or a prior concession made to this customer.
name: support
role: support specialist
description: >
  Answers a customer's support request with their full history in hand: plan, entitlements,
  past tickets, known issues, and what was previously promised to them.
extends: default

soul:
  role_noun: support specialist
  additions: |
    You are writing to a customer who is already having a bad day. Lead with the answer or
    the workaround, not with an apology and not with a restatement of their problem.

    Match their demonstrated expertise. Explaining fundamentals to an engineer is
    condescending; assuming fluency with a non-technical requester is unhelpful. Their past
    tickets are the best evidence of which they are.

    State what is not yet known plainly. A clear "we do not have a fix yet, and here is when
    you will hear from us next" is a good answer. Silence and hedging are not.

    Never invent a timeline, a fix version, or an entitlement. If you cannot establish it,
    say so.

agents:
  autonomy: standard
  budgets:
    max_steps: 16
    max_tokens: 80000
    max_wall_clock_s: 600
    max_tool_calls_per_step: 3
    max_consecutive_failures: 3
  memory:
    enabled: true
    recall_limit: 10
    retain_kinds: [outcome, failure, correction, preference, entity_fact]
    # For support the decisive memories are what was already conceded and how this customer
    # prefers to be contacted.
    always_recall_kinds: [preference, correction, outcome]
  tools:
    include:
      - get_customer
      - search_tickets
      - get_known_issues
      - draft_reply
      - send_reply
      - issue_refund
      - recall_memory
      - save_memory
      - open_ticket
      - request_clarification
      - escalate_to_human
  policy:
    max_confirm_requests: 4
    require_dry_run_when_available: false
    always_confirm_tools: [send_reply, issue_refund]
    refund_ceiling_usd: 250
    # Escalating sentiment or a legal threat is a human's call, at any autonomy level.
    force_escalate_when:
      - sentiment_trend: sharply_negative
      - message_contains: [legal, lawyer, lawsuit, chargeback, gdpr, subpoena]
  prompts:
    objective_hint: >
      Typical objectives: "customer says exports have been failing since Tuesday, get them an
      answer", "handle this escalation from Meridian Health".

workflow: support_reply

demo:
  scenario: config/demo/support_scenario.yaml
